<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jaulistine | Smart Home</title>
<style>
:root{--bg:#101216;--panel:#1a1e24;--panel2:#20252d;--line:#343b45;--text:#f3f1ec;--muted:#a3a8ad;--gold:#c6ad83;--gold2:#e0cfad;--green:#9fc7a9;--red:#d89b91}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{background:radial-gradient(ellipse at 78% 8%,#30323a 0,#171a20 38%,#101216 78%)}
.screen{width:1280px;height:800px;margin:auto;padding:38px 48px;position:relative}
.top{height:74px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:20px}
.brand{font-size:27px;letter-spacing:5px;font-weight:500}.brand span{color:var(--gold)}
.sub{font-size:11px;letter-spacing:3px;color:var(--muted);margin-top:8px}
.status{font-size:11px;letter-spacing:2px;color:var(--green);border:1px solid #46574b;padding:10px 15px;border-radius:20px}
.main{display:grid;grid-template-columns:1.05fr 1fr;gap:24px;margin-top:25px;height:430px}
.panel{background:linear-gradient(145deg,rgba(35,40,48,.96),rgba(23,27,33,.96));border:1px solid var(--line);border-radius:18px;padding:27px 30px;box-shadow:0 18px 40px #0005}
.kicker{font-size:11px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
.temp{font-size:112px;line-height:1;font-weight:300;letter-spacing:-5px;margin:18px 0 4px}
.temp small{font-size:43px;letter-spacing:0;color:var(--gold2);vertical-align:top;margin-left:7px}
.caption{font-size:13px;color:var(--muted);letter-spacing:1px}
.targetrow{display:flex;align-items:center;justify-content:space-between;margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}
.target{font-size:30px;color:var(--gold2);margin-top:7px}
.controls{display:flex;gap:12px}
.ctrl{width:62px;height:54px;border:1px solid #8f7d60;border-radius:12px;background:linear-gradient(145deg,#37332c,#24252a);color:var(--gold2);font-size:27px}
.ctrl:after{content:""}
.readings{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.tile{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:14px;padding:20px 20px;height:122px}
.tile .value{font-size:27px;margin-top:14px;color:var(--text)}
.tile .value.good{color:var(--green)}
.tile .value.gold{color:var(--gold2)}
.tile .value em{font-size:12px;color:var(--muted);font-style:normal}
.bottom{margin-top:22px}
.modehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
.modehint{font-size:11px;color:var(--muted);letter-spacing:1px}
.modes{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.mode{height:76px;border:1px solid var(--line);border-radius:13px;background:linear-gradient(145deg,#242932,#191d23);color:#c8c9c8;font-size:13px;letter-spacing:.7px}
.mode.active{border-color:var(--gold);background:linear-gradient(145deg,#494235,#292821);color:var(--gold2);box-shadow:inset 0 0 0 1px #c6ad8333}
.mode span{display:block;font-size:10px;color:var(--muted);margin-top:7px;letter-spacing:1px}
.footer{position:absolute;bottom:20px;left:48px;right:48px;display:flex;justify-content:space-between;color:#737a82;font-size:10px;letter-spacing:2px}
@media(max-width:1280px),(max-height:800px){.screen{transform-origin:top left;}}
</style>
</head>
<body>
<div class="screen">
  <header class="top">
    <div><div class="brand">JAULISTINE<span>.</span></div><div class="sub">SMART HOME CONTROL</div></div>
    <div class="status">● SYSTEM ONLINE</div>
  </header>
  <main class="main">
    <section class="panel">
      <div class="kicker">Indoor temperature</div>
      <div class="temp"><span id="indoor">72.0</span><small>°F</small></div>
      <div class="caption">CURRENT ROOM TEMPERATURE</div>
      <div class="targetrow">
        <div><div class="kicker">Desired temperature</div><div class="target"><span id="target">72</span>°F</div></div>
        <div class="controls"><button class="ctrl" aria-label="Decrease temperature">−</button><button class="ctrl" aria-label="Increase temperature">+</button></div>
      </div>
    </section>
    <section class="panel">
      <div class="kicker" style="margin-bottom:17px">Environment</div>
      <div class="readings">
        <div class="tile"><div class="kicker">Humidity</div><div class="value gold"><span id="humidity">48</span><em>%</em></div></div>
        <div class="tile"><div class="kicker">Air quality</div><div class="value good" id="air">GOOD</div></div>
        <div class="tile"><div class="kicker">Weather</div><div class="value gold" id="weather">SUNNY</div></div>
        <div class="tile"><div class="kicker">Fan setting</div><div class="value" id="fan">AUTO</div></div>
      </div>
    </section>
  </main>
  <section class="bottom">
    <div class="modehead"><div class="kicker">Environment mode</div><div class="modehint">MANUAL CONTROL · NO AUTOMATIC SCHEDULE</div></div>
    <div class="modes">
      <button class="mode">MORNING<span>MODE 01</span></button>
      <button class="mode active">DAY<span>MODE 02</span></button>
      <button class="mode">EVENING<span>MODE 03</span></button>
      <button class="mode">NIGHT<span>MODE 04</span></button>
      <button class="mode">AWAY<span>MODE 05</span></button>
      <button class="mode">CUSTOM<span>MODE 06</span></button>
    </div>
  </section>
  <footer class="footer"><span>JAULISTINE HOME SYSTEMS</span><span>DESIGNED FOR YOUR SPACE</span></footer>
</div>
<script>
/* The LSL controller supplies the display state in the page URL.
   Screen actions are handled by touching the matching regions on the prim. */
const q=new URLSearchParams(location.search);
const set=(id,key,fallback)=>{const e=document.getElementById(id);if(e)e.textContent=q.get(key)??fallback};
set("indoor","indoor","72.0");set("target","target","72");set("humidity","humidity","48");
set("air","air","GOOD");set("weather","weather","SUNNY");set("fan","fan","AUTO");
const mode=(q.get("mode")||"DAY").toUpperCase();
document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("active",b.textContent.trim().split("\n")[0]===mode));
</script>
</body></html>
